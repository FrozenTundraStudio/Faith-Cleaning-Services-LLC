    <script src="/assets/js/scripts.js"></script>

<body>

    <nav>
        <ul>
            <li><a href="/index.html">Home</a></li>
            <li><a href="/contact/index.html">Contact</a></li>
            <li><a href="/services/index.html">Services</a></li>
            <li><a href="/about/index.html">About</a></li>
        </ul>
    </nav>

    <section class="services" id="services">
        <div class="gallery-item">
            <img src="/assets/img/moving.jpg" alt="moving" width="600" height="400" 
            onclick="openModal('modal1', 'Move in / Move out cleans', 'Are you moving out of your apartment and need a reliable cleaning service to save you time and money? Are you looking to sell your house and want to showcase the true potential? Get in contact with us today to schedule a consultation!')">
            <div class="img-description">Move in / Move out cleans</div>
        </div>

        <div class="gallery-item">
            <img src="/assets/img/construction.jpg" alt="construction" width="600" height="400"
            onclick="openModal('modal2', 'Post construction cleans', 'Is your business going through a remodel? Skip the hassle of cleaning up the dust and debris, contact us and get your business looking as good as you imagined!')">
            <div class="img-description">Post construction cleans</div>
        </div>

        <div class="gallery-item">
            <img src="/assets/img/janitor.jpg" alt="janitorial" width="600" height="400"
            onclick="openModal('modal3', 'Janitorial cleaning', 'Let us take care of your cleaning needs and keep your business looking professional around your schedule! Contact us today to get next steps so you can free your team up for more important things!')">
            <div class="img-description">Janitorial cleaning</div>
        </div>

        <div class="gallery-item">
            <img src="/assets/img/apartment.jpg" alt="property" width="600" height="400"
            onclick="openModal('modal4', 'Property cleans', 'Are you a property manager looking for someone to maintain hallways and keep the public areas of your businesses clean? Look no further! Send us an email today to schedule a quote!')">
            <div class="img-description">Property cleans</div>
        </div>

        <div class="gallery-item">
            <img src="/assets/img/project.jpg" alt="project" width="600" height="400"
            onclick="openModal('modal5', 'Special projects', 'We also take care of a wide variety of special projects ranging from carpet cleaning, to exterior window washing! Contact us for further information on any projects you may need!')">
            <div class="img-description">Special projects</div>
        </div>

        <div id="modal1" class="modal" onclick="closeModal('modal1')">
            <span class="close" onclick="closeModal('modal1')">&times;</span>
            <div class="modal-content">
                <img src="/assets/img/moving.jpg" alt="moving" class="modal-image">
                <div class="caption"></div>
                <div class="caption-description"></div>
            </div>
        </div>

        <div id="modal2" class="modal" onclick="closeModal('modal2')">
            <span class="close" onclick="closeModal('modal2')">&times;</span>
            <div class="modal-content">
                <img src="/assets/img/construction.jpg" alt="construction" class="modal-image">
                <div class="caption"></div>
                <div class="caption-description"></div>
            </div>
        </div>

        <div id="modal3" class="modal" onclick="closeModal('modal3')">
            <span class="close" onclick="closeModal('modal3')">&times;</span>
            <div class="modal-content">
                <img src="/assets/img/janitor.jpg" alt="janitorial" class="modal-image">
                <div class="caption"></div>
                <div class="caption-description"></div>
            </div>
        </div>

        <div id="modal4" class="modal" onclick="closeModal('modal4')">
            <span class="close" onclick="closeModal('modal4')">&times;</span>
            <div class="modal-content">
                <img src="/assets/img/apartment.jpg" alt="property" class="modal-image">
                <div class="caption"></div>
                <div class="caption-description"></div>
            </div>
        </div>

        <div id="modal5" class="modal" onclick="closeModal('modal5')">
            <span class="close" onclick="closeModal('modal5')">&times;</span>
            <div class="modal-content">
                <img src="/assets/img/project.jpg" alt="project" class="modal-image">
                <div class="caption"></div>
                <div class="caption-description"></div>
            </div>
        </div>
    </section>
